<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dice Assemblers">
    <meta name="theme-color" content="#0e1116">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <title>Dice Assemblers - Playtest</title>
    <script>
      // "Add to home screen": mobile only. Android (Chrome / Edge / ...) fires beforeinstallprompt once the manifest is installable; it can fire long
      // before Unity is up, so it is caught here and Unity polls it through the DAWEB_* jslib functions. iPhone / iPad have no such event (a how-to
      // overlay is shown instead). A PC gets no button at all.
      window.diceInstall = (function () {
        var deferred = null, installedFlag = false;
        var ua = navigator.userAgent || '';
        var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var android = /Android/i.test(ua);
        function media(q) { try { return !!(window.matchMedia && window.matchMedia(q).matches); } catch (e) { return false; } }
        window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; });
        window.addEventListener('appinstalled', function () { installedFlag = true; deferred = null; });
        // already running as an installed / home-screen app (a plain browser fullscreen does not count)
        function installed() {
          var inBrowserFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
          return installedFlag || navigator.standalone === true || media('(display-mode: standalone)') || media('(display-mode: minimal-ui)') ||
            (media('(display-mode: fullscreen)') && !inBrowserFullscreen);
        }
        return {
          installed: installed,
          // 0 = no button (PC, or already an app), 1 = Android (the browser's install dialog), 2 = iPhone / iPad (how-to overlay)
          mode: function () { if (installed()) return 0; if (ios) return 2; if (android) return 1; return 0; },
          // must run inside the click that asked for it (transient user activation); 1 = the browser's own dialog opened
          request: function () {
            if (!deferred) return 0;
            var ev = deferred;
            deferred = null;   // an event can be prompted once
            try {
              ev.prompt();
              if (ev.userChoice && ev.userChoice.then) ev.userChoice.then(function (c) { if (c && c.outcome === 'accepted') installedFlag = true; });
              return 1;
            } catch (e) { return 0; }
          }
        };
      })();
    </script>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0e1116; overflow: hidden; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #0e1116; touch-action: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 color: #dbb861; font: 600 20px/1.4 system-ui, "Yu Gothic", "Hiragino Sans", sans-serif; letter-spacing: 0.08em; }
      #loading small { margin-top: 10px; color: #8b8f96; font-weight: 400; letter-spacing: 0; font-size: 13px; }
      #bar { margin-top: 18px; width: min(320px, 60vw); height: 6px; background: #232830; border-radius: 3px; overflow: hidden; }
      #bar > div { width: 0%; height: 100%; background: #dbb861; transition: width .15s linear; }
      #error { display: none; position: fixed; left: 0; right: 0; top: 40%; text-align: center; color: #e07070; font: 16px/1.5 system-ui, sans-serif; padding: 0 24px; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">DICE ASSEMBLERS<div id="bar"><div id="fill"></div></div><small>読み込み中… / Loading (first time takes a moment)</small></div>
    <div id="error"></div>
    <script src="Build/WebGL.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/WebGL.data",
        frameworkUrl: "Build/WebGL.framework.js",
        codeUrl: "Build/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "DiceAssembly",
        productVersion: "0.1.0",
      }, function (progress) {
        document.getElementById("fill").style.width = Math.round(progress * 100) + "%";
      }).then(function (unityInstance) {
        window.diceUnity = unityInstance;
        document.getElementById("loading").style.display = "none";
      }).catch(function (message) {
        document.getElementById("loading").style.display = "none";
        var e = document.getElementById("error");
        e.style.display = "block";
        e.textContent = "Could not start the game: " + message;
      });
    </script>
  </body>
</html>
